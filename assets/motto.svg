<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><style>text{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs></defs><rect width="1280" height="600" fill="#0D0D0B"/><text x="72" y="52" font-size="12" fill="#8C877B" text-anchor="start" font-weight="400" letter-spacing="2.5" >01 / MOTTO</text><text x="1208" y="52" font-size="12" fill="#8C877B" text-anchor="end" font-weight="400" letter-spacing="2.5" >FOR THOSE WHO KNOW</text><line x1="72" y1="76" x2="1208" y2="76" stroke="#2C2B26"/><text x="68" y="178" font-size="70" fill="#ECE6D9" text-anchor="start" font-weight="700" letter-spacing="-3" >LEARNING</text><text x="68" y="260" font-size="70" fill="#ECE6D9" text-anchor="start" font-weight="700" letter-spacing="-3" >MATRIX</text><text x="68" y="342" font-size="70" fill="#ECE6D9" text-anchor="start" font-weight="700" letter-spacing="-3" >MULTIPLICATION</text><rect x="72" y="372" width="56" height="4" fill="#FF5A1F"/><text x="72" y="420" font-size="15.5" fill="#BDB7AA" text-anchor="start" font-weight="400" letter-spacing="0" >Strip away the hype and an LLM is a stack</text><text x="72" y="446" font-size="15.5" fill="#BDB7AA" text-anchor="start" font-weight="400" letter-spacing="0" >of matrix multiplications with a few</text><text x="72" y="472" font-size="15.5" fill="#BDB7AA" text-anchor="start" font-weight="400" letter-spacing="0" >nonlinearities in between. Training is just</text><text x="72" y="498" font-size="15.5" fill="#BDB7AA" text-anchor="start" font-weight="400" letter-spacing="0" >learning which numbers go inside them.</text><text x="72" y="524" font-size="15.5" fill="#BDB7AA" text-anchor="start" font-weight="400" letter-spacing="0" >That&#x27;s the whole game. I&#x27;m still learning it.</text><text x="72" y="566" font-size="12" fill="#8C877B" text-anchor="start" font-weight="400" letter-spacing="1" >@ = matmul · 2N flops per token to infer · 6ND to train</text><rect x="690.5" y="108.5" width="518" height="476" fill="#141412" stroke="#2C2B26"/><line x1="690" y1="142" x2="1208" y2="142" stroke="#2C2B26"/><text x="710" y="130" font-size="12" fill="#8C877B" text-anchor="start" font-weight="400" letter-spacing="1" >forward.py</text><text x="1188" y="130" font-size="12" fill="#8C877B" text-anchor="end" font-weight="400" letter-spacing="1" >a transformer, honestly</text><g><rect x="691" y="166" width="517" height="38" fill="#FF5A1F" fill-opacity=".08"><animate attributeName="y" values="166;212;258;304;350;396;488" dur="7.2s" repeatCount="indefinite" calcMode="discrete"/></rect><rect x="691" y="166" width="3" height="38" fill="#FF5A1F"><animate attributeName="y" values="166;212;258;304;350;396;488" dur="7.2s" repeatCount="indefinite" calcMode="discrete"/></rect></g><text x="714" y="192" font-size="13" fill="#4A4740" text-anchor="start" font-weight="400" letter-spacing="0" xml:space="preserve"> 1</text><text x="754" y="192" font-size="17" fill="#ECE6D9" text-anchor="start" font-weight="400" letter-spacing="0" xml:space="preserve">x = tokens <tspan fill="#FF5A1F" font-weight="700">@</tspan> W_embed</text><text x="714" y="238" font-size="13" fill="#4A4740" text-anchor="start" font-weight="400" letter-spacing="0" xml:space="preserve"> 2</text><text x="754" y="238" font-size="17" fill="#ECE6D9" text-anchor="start" font-weight="400" letter-spacing="0" xml:space="preserve">q, k, v = x <tspan fill="#FF5A1F" font-weight="700">@</tspan> W_q, x <tspan fill="#FF5A1F" font-weight="700">@</tspan> W_k, x <tspan fill="#FF5A1F" font-weight="700">@</tspan> W_v</text><text x="714" y="284" font-size="13" fill="#4A4740" text-anchor="start" font-weight="400" letter-spacing="0" xml:space="preserve"> 3</text><text x="754" y="284" font-size="17" fill="#ECE6D9" text-anchor="start" font-weight="400" letter-spacing="0" xml:space="preserve">a = softmax(q <tspan fill="#FF5A1F" font-weight="700">@</tspan> k.T / sqrt(d)) <tspan fill="#FF5A1F" font-weight="700">@</tspan> v</text><text x="714" y="330" font-size="13" fill="#4A4740" text-anchor="start" font-weight="400" letter-spacing="0" xml:space="preserve"> 4</text><text x="754" y="330" font-size="17" fill="#ECE6D9" text-anchor="start" font-weight="400" letter-spacing="0" xml:space="preserve">h = gelu(a <tspan fill="#FF5A1F" font-weight="700">@</tspan> W_up) <tspan fill="#FF5A1F" font-weight="700">@</tspan> W_down</text><text x="714" y="376" font-size="13" fill="#4A4740" text-anchor="start" font-weight="400" letter-spacing="0" xml:space="preserve"> 5</text><text x="754" y="376" font-size="17" fill="#ECE6D9" text-anchor="start" font-weight="400" letter-spacing="0" xml:space="preserve">x = x + h</text><text x="714" y="422" font-size="13" fill="#4A4740" text-anchor="start" font-weight="400" letter-spacing="0" xml:space="preserve"> 6</text><text x="754" y="422" font-size="17" fill="#ECE6D9" text-anchor="start" font-weight="400" letter-spacing="0" xml:space="preserve">logits = x <tspan fill="#FF5A1F" font-weight="700">@</tspan> W_unembed</text><text x="714" y="514" font-size="13" fill="#4A4740" text-anchor="start" font-weight="400" letter-spacing="0" xml:space="preserve"> 8</text><text x="754" y="514" font-size="17" fill="#ECE6D9" text-anchor="start" font-weight="400" letter-spacing="0" xml:space="preserve">loss.backward()  <tspan fill="#8C877B"># more @</tspan></text></svg>